name: Fossify Theming Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'performance/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build standalone and stock-compat debug APKs
        run: ./gradlew assembleStandaloneDebug assembleCompatDebug --stacktrace

      - name: Build optimized compatibility APK
        run: ./gradlew assembleCompatPerformance --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: fossify-theming-debug-apks
          path: |
            app/build/outputs/apk/standalone/debug/*.apk
            app/build/outputs/apk/compat/debug/*.apk
          if-no-files-found: error

      - name: Upload performance APK
        uses: actions/upload-artifact@v4
        with:
          name: fossify-theming-performance-apk
          path: app/build/outputs/apk/compat/performance/*.apk
          if-no-files-found: error

      - name: Publish temporary performance APK to repository folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p performance
          cp app/build/outputs/apk/compat/performance/*.apk \
            performance/Fossify-Theming-compat-performance-temporary-signed.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add performance/Fossify-Theming-compat-performance-temporary-signed.apk
          if git diff --cached --quiet; then
            echo "Performance APK is already current."
            exit 0
          fi
          git commit -m "Update temporary performance APK [skip ci]"
          git push
