name: One-time theming-only cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate source namespace and remove final legacy naming
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/kotlin/org/forfossify
          git mv app/src/main/kotlin/org/fossify/thankyou app/src/main/kotlin/org/forfossify/theming

          python3 <<'PY'
          from pathlib import Path

          source_root = Path('app/src/main/kotlin/org/forfossify/theming')
          for path in source_root.rglob('*.kt'):
              text = path.read_text()
              lines = []
              for line in text.splitlines(keepends=True):
                  if line.startswith('package org.fossify.thankyou') or line.startswith('import org.fossify.thankyou'):
                      line = line.replace('org.fossify.thankyou', 'org.forfossify.theming', 1)
                  lines.append(line)
              text = ''.join(lines)
              text = text.replace(
                  'private const val LAUNCHER_ALIAS_PREFIX = "org.fossify.thankyou.activities.SplashActivity"',
                  'private const val LAUNCHER_ALIAS_PREFIX = "org.forfossify.theming.activities.SplashActivity"',
              )
              # Preview-only package label, not the intentional stock-compat package checks.
              text = text.replace(
                  'packageName = "org.fossify.thankyou.debug"',
                  'packageName = "org.forfossify.theming"',
              )
              path.write_text(text)

          for manifest in [Path('app/src/main/AndroidManifest.xml'), Path('app/src/compat/AndroidManifest.xml')]:
              text = manifest.read_text()
              text = text.replace('org.fossify.thankyou.activities.', 'org.forfossify.theming.activities.')
              text = text.replace('org.fossify.thankyou.services.', 'org.forfossify.theming.services.')
              text = text.replace('org.fossify.thankyou.receivers.', 'org.forfossify.theming.receivers.')
              text = text.replace('org.fossify.thankyou.contentproviders.', 'org.forfossify.theming.contentproviders.')
              text = text.replace(
                  'android:name=".activities.SplashActivity.',
                  'android:name="org.forfossify.theming.activities.SplashActivity.',
              )
              manifest.write_text(text)

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          text = text.replace('namespace = "org.fossify.thankyou"', 'namespace = "org.forfossify.theming"')
          text = text.replace(
              '// Legacy source namespace is kept for now because stock compatibility still targets\n    // the original Fossify global-theme contract. Product identity is controlled by applicationId.\n    namespace = "org.forfossify.theming"',
              '// Kotlin/Compose namespace belongs to Fossify Theming. The compat flavor only changes\n    // the installed applicationId/provider contract for unmodified stock Fossify apps.\n    namespace = "org.forfossify.theming"',
          )
          build.write_text(text)

          for baseline in [Path('app/detekt-baseline.xml'), Path('app/lint-baseline.xml')]:
              if baseline.exists():
                  baseline.write_text(baseline.read_text().replace('org.fossify.thankyou', 'org.forfossify.theming'))

          plan = Path('PLAN.md')
          text = plan.read_text()
          text = text.replace('kotlin/org/fossify/thankyou/', 'kotlin/org/forfossify/theming/')
          text = text.replace(
              'Der Kotlin-Source-Namespace ist derzeit noch der historische Upstream-Namespace. Er enthält keine Thank-You-Produktlogik mehr. Eine spätere reine Namespace-Migration ist möglich, ist aber nicht nötig, um die Android-Produktidentität oder das Theming-Verhalten zu bestimmen.\n',
              'Der Kotlin-Source-Namespace ist vollständig auf `org.forfossify.theming` migriert. Der alte Thank-You-Namespace bleibt nur als absichtlich verwendete Package-ID im Stock-Kompatibilitätsmodus bestehen.\n',
          )
          text = text.replace('- UNKLAR: Wann der historische Kotlin-Source-Namespace ebenfalls auf `org.forfossify.theming` migriert werden soll.\n', '')
          plan.write_text(text)
          PY

          # This workflow deletes itself after doing the one-time migration.
          git rm .github/workflows/one-time-cleanup.yml

          echo 'Remaining org.fossify.thankyou occurrences, intentional compat references are allowed:'
          grep -RIn --exclude='*.apk' 'org\.fossify\.thankyou' app README.md PLAN.md MODIFICATIONS.md UPSTREAM.md performance/README.md || true

      - name: Commit cleanup to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish theming-only namespace cleanup"
          git push origin HEAD:main

      - name: Delete stale branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            'feature/hybrid-system-theming' \
            'fossifybot/commons' \
            'dependabot/gradle/androidx-lifecycle-2.11.0' \
            'dependabot/gradle/org.jetbrains.kotlin.plugin.compose-2.4.10'
          do
            git push origin --delete "$branch" || true
          done
